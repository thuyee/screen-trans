name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # cần để đính APK vào GitHub Release khi đẩy tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK debug (lớn hơn nhưng chắc chắn build được)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build APK release (thu nhỏ bằng R8, ký khóa debug, cài được ngay)
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Tải APK debug lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DichManHinh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Tải APK release (nhẹ) lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DichManHinh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Đính APK vào GitHub Release (khi push tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
